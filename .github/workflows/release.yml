name: Release

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Get plugin metadata
        id: meta
        run: |
          # Plugin slug from main PHP file (handles case mismatch between repo name and file name).
          PLUGIN_FILE=$(grep -rPl 'Plugin Name\s*:' --include='*.php' --max-depth=1 . | head -1)
          PLUGIN_SLUG=$(basename "${PLUGIN_FILE%.php}")
          VERSION="${GITHUB_REF#refs/tags/}"
          echo "slug=${PLUGIN_SLUG}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Verify version in plugin header
        env:
          EXPECTED_VERSION: ${{ steps.meta.outputs.version }}
          PLUGIN_SLUG: ${{ steps.meta.outputs.slug }}
        run: |
          HEADER_VERSION=$(grep -oP 'Version:\s*\K[0-9]+\.[0-9]+\.[0-9]+' "${PLUGIN_SLUG}.php")
          if [ "$HEADER_VERSION" != "$EXPECTED_VERSION" ]; then
            echo "::error::Tag version ($EXPECTED_VERSION) does not match plugin header version ($HEADER_VERSION)"
            exit 1
          fi

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer

      - run: composer install --no-dev --no-interaction --optimize-autoloader

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci && npm run build

      - name: Create plugin zip
        env:
          SLUG: ${{ steps.meta.outputs.slug }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          node node_modules/@wordpress/scripts/scripts/plugin-zip.js
          mv "${SLUG}.zip" "${SLUG}-${VERSION}.zip"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.meta.outputs.slug }}-${{ steps.meta.outputs.version }}.zip
          generate_release_notes: true
